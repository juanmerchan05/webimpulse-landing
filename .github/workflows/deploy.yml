name: Deploy WebImpulse to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/estructura-unidad-3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Studio dependencies
        run: npm install --prefix studio --legacy-peer-deps
      - name: Build Studio
        run: npm run build --prefix studio -- --outDir ../public/studio
      - name: Prepare landing and assets
        run: |
          mkdir -p public/assets/images
          cp index.html styles.css script.js public/
          cp -R assets/images/. public/assets/images/
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
